<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 200" role="img" aria-label="Dark Souls themed header">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d0b09"/>
      <stop offset="45%" stop-color="#1a1410"/>
      <stop offset="100%" stop-color="#2b1f14"/>
    </linearGradient>
    <linearGradient id="title" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8a7048"/>
      <stop offset="35%" stop-color="#f0d58c"/>
      <stop offset="65%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#8a7048"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1100" height="200" rx="12" fill="url(#bg)"/>
  <rect x="8" y="8" width="1084" height="184" rx="8" fill="none" stroke="#5c4a32" stroke-width="2"/>
  <rect x="16" y="16" width="1068" height="168" rx="6" fill="none" stroke="#c9a227" stroke-width="1" opacity="0.45"/>
  <g opacity="0.35">
    <circle cx="120" cy="40" r="2" fill="#ffb347"><animate attributeName="opacity" dur="4s" repeatCount="indefinite" values="0.2;0.9;0.2"/></circle>
    <circle cx="980" cy="55" r="2.5" fill="#ff8c42"><animate attributeName="opacity" dur="3.2s" repeatCount="indefinite" values="0.15;0.8;0.15"/></circle>
    <circle cx="860" cy="150" r="1.8" fill="#e25822"><animate attributeName="opacity" dur="2.8s" repeatCount="indefinite" values="0.1;0.7;0.1"/></circle>
    <circle cx="240" cy="160" r="2" fill="#ffd27d"><animate attributeName="opacity" dur="3.6s" repeatCount="indefinite" values="0.2;0.85;0.2"/></circle>
  </g>
  <text x="550" y="92" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="46" font-weight="700" fill="url(#title)" filter="url(#glow)">Guilherme Botingnon</text>
  <text x="550" y="128" text-anchor="middle" font-family="Georgia, serif" font-size="18" letter-spacing="6" fill="#8a8070">FULL STACK · LINK THE FIRE</text>
  <text x="550" y="168" text-anchor="middle" font-family="monospace" font-size="13" fill="#c44d2d" opacity="0.85">” Praise the Code · Rest at the Bonfire ”</text>
</svg>
