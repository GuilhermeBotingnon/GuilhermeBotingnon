<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1584 396" role="img" aria-label="Guilherme Botingnon — Desenvolvedor Full Stack">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="55%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0891b2"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0891b2" stop-opacity="0"/>
      <stop offset="100%" stop-color="#0891b2" stop-opacity="0.18"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="24" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1584" height="396" fill="url(#bg)"/>
  <rect width="1584" height="396" fill="url(#grid)"/>
  <circle cx="120" cy="320" r="90" fill="#164e63" fill-opacity="0.2"/>
  <circle cx="544" cy="72" r="140" fill="url(#glow)" filter="url(#softGlow)"/>
  <rect x="1579" y="0" width="5" height="396" fill="url(#accent)"/>

  <g transform="translate(1512 194)">
    <text text-anchor="end" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="48" font-weight="700" letter-spacing="0.02em" fill="#f8fafc">
      <tspan x="0" y="0">Guilherme Botingnon</tspan>
    </text>
    <text text-anchor="end" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="24" font-weight="500" letter-spacing="0.08em" fill="url(#accent)">
      <tspan x="0" y="42">DESENVOLVEDOR FULL STACK</tspan>
    </text>
    <text text-anchor="end" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="400" letter-spacing="0.04em" fill="#94a3b8">
      <tspan x="0" y="76">Automação · E-commerce · Infraestrutura · Remoto</tspan>
    </text>
  </g>
</svg>
