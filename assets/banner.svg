<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 200" role="img" aria-label="Guilherme Botingnon — Desenvolvedor Full Stack">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="55%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0891b2"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="glow" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0891b2" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#0891b2" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="200" fill="url(#bg)"/>
  <rect width="1200" height="200" fill="url(#grid)"/>
  <circle cx="1040" cy="36" r="120" fill="url(#glow)" filter="url(#softGlow)"/>
  <circle cx="1120" cy="170" r="80" fill="#164e63" fill-opacity="0.35"/>

  <rect x="0" y="0" width="5" height="200" fill="url(#accent)"/>

  <g transform="translate(72 98)">
    <text
      font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
      font-size="38"
      font-weight="700"
      letter-spacing="0.02em"
      fill="#f8fafc"
    >
      <tspan x="0" y="0">Guilherme Botingnon</tspan>
    </text>
    <text
      y="34"
      font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
      font-size="20"
      font-weight="500"
      letter-spacing="0.08em"
      fill="url(#accent)"
    >
      <tspan x="0" y="34">DESENVOLVEDOR FULL STACK</tspan>
    </text>
    <text
      y="62"
      font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
      font-size="14"
      font-weight="400"
      letter-spacing="0.04em"
      fill="#94a3b8"
    >
      <tspan x="0" y="62">Automação · E-commerce · Infraestrutura · Remoto</tspan>
    </text>
  </g>

  <g transform="translate(1120 100)" opacity="0.9">
    <rect x="-148" y="-18" width="148" height="36" rx="18" fill="#164e63" fill-opacity="0.55" stroke="#0891b2" stroke-opacity="0.35"/>
    <text
      x="-74"
      y="6"
      text-anchor="middle"
      font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
      font-size="13"
      font-weight="600"
      letter-spacing="0.06em"
      fill="#e2e8f0"
    >
      OPEN TO WORK
    </text>
  </g>
</svg>
